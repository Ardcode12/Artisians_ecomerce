<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Artisans Welfare & Scheme Discovery</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel for standalone browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .glass-card {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(240, 246, 252, 0.1);
    }
    .glass-card:hover {
      border-color: rgba(181, 80, 47, 0.4);
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    function App() {
      const [schemes, setSchemes] = useState([]);
      const [crawlStatus, setCrawlStatus] = useState([]);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [keyword, setKeyword] = useState('');
      const [category, setCategory] = useState('All');
      const [providerType, setProviderType] = useState('All');
      const [refreshMsg, setRefreshMsg] = useState('');
      const [speakingSchemeId, setSpeakingSchemeId] = useState(null);
      const isSpeechAvailable = typeof window !== 'undefined' && Boolean(window.speechSynthesis);
      const [speechSupported, setSpeechSupported] = useState(isSpeechAvailable);

      useEffect(() => {
        if (typeof window !== 'undefined' && Boolean(window.speechSynthesis)) {
          setSpeechSupported(true);
        }
        return () => {
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.cancel();
          }
        };
      }, []);

      const handleToggleSpeech = (scheme) => {
        if (!speechSupported) return;

        if (speakingSchemeId === scheme.id) {
          window.speechSynthesis.cancel();
          setSpeakingSchemeId(null);
          return;
        }

        window.speechSynthesis.cancel();

        const textToRead = `${scheme.scheme_name || 'Scheme'}. ${scheme.simple_summary || scheme.benefits_offered || ''}`;
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.rate = 0.95;

        utterance.onend = () => {
          setSpeakingSchemeId((current) => (current === scheme.id ? null : current));
        };
        utterance.onerror = () => {
          setSpeakingSchemeId((current) => (current === scheme.id ? null : current));
        };

        setSpeakingSchemeId(scheme.id);
        window.speechSynthesis.speak(utterance);
      };

      // Fetch schemes from live API
      const fetchSchemes = useCallback(async () => {
        try {
          setLoading(true);
          const params = new URLSearchParams();
          if (providerType !== 'All') params.append('provider_type', providerType);
          if (category !== 'All') params.append('category', category);
          if (keyword.trim()) params.append('keyword', keyword.trim());

          params.append('_t', Date.now().toString());

          const res = await fetch(`/api/schemes?${params.toString()}`, {
            cache: 'no-cache',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
            },
          });
          if (res.ok) {
            const data = await res.json();
            setSchemes(data.schemes || []);
          }
        } catch (err) {
          console.error("Failed to load schemes:", err);
        } finally {
          setLoading(false);
        }
      }, [providerType, category, keyword]);

      // Fetch crawl status
      const fetchCrawlStatus = useCallback(async () => {
        try {
          const res = await fetch('/api/schemes/crawl-status');
          if (res.ok) {
            const data = await res.json();
            setCrawlStatus(data.sources_status || []);
          }
        } catch (err) {
          console.error("Failed to fetch crawl status:", err);
        }
      }, []);

      useEffect(() => {
        fetchSchemes();
      }, [fetchSchemes]);

      useEffect(() => {
        fetchCrawlStatus();
      }, [fetchCrawlStatus]);

      // Refresh handler
      const handleRefresh = async () => {
        try {
          setRefreshing(true);
          setRefreshMsg('Running live web scrapers and AI extractor...');
          const res = await fetch('/api/schemes/refresh', { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            setRefreshMsg(`Complete! ${data.schemes_saved} scheme(s) updated.`);
            fetchSchemes();
            fetchCrawlStatus();
          } else {
            setRefreshMsg('Refresh failed. Please check backend logs.');
          }
        } catch (err) {
          setRefreshMsg(`Error: ${err.message}`);
        } finally {
          setRefreshing(false);
          setTimeout(() => setRefreshMsg(''), 5000);
        }
      };

      const categories = ['All', 'financial aid', 'market access', 'training', 'welfare'];
      const providers = ['All', 'government', 'ngo', 'private'];

      return (
        <div class="max-w-6xl mx-auto px-4 py-8">
          {/* Header */}
          <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-gray-800">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  Government & NGO Welfare
                </span>
                <span class="text-xs text-gray-500">• Live SQLite On-Device Feed</span>
              </div>
              <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">
                Scheme Discovery for Artisans & Weavers
              </h1>
              <p class="text-sm text-gray-400 mt-1">
                Subsidies, collateral-free credit, toolkits, and marketing access for traditional craftspeople.
              </p>
            </div>

            {/* Refresh Button */}
            <div class="flex items-center gap-3">
              <button
                onClick={handleRefresh}
                disabled={refreshing}
                class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-[#B5502F] hover:bg-[#9E4528] text-white shadow-lg shadow-orange-950/40 transition disabled:opacity-50"
              >
                {refreshing ? (
                  <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                  </svg>
                ) : (
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                  </svg>
                )}
                <span>{refreshing ? 'Refreshing...' : 'Refresh Sources'}</span>
              </button>
            </div>
          </header>

          {refreshMsg && (
            <div class="mt-4 p-3 rounded-lg bg-orange-900/30 border border-orange-500/40 text-orange-200 text-sm flex items-center justify-between">
              <span>{refreshMsg}</span>
            </div>
          )}

          {/* Crawl Status Bar */}
          {crawlStatus.length > 0 && (
            <div class="mt-6 p-4 rounded-xl glass-card">
              <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">
                Live Source Verification Status
              </h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5">
                {crawlStatus.map((src, i) => (
                  <div key={i} class="p-2 rounded-lg bg-gray-900/60 border border-gray-800 text-xs flex flex-col justify-between">
                    <span class="font-medium text-gray-300 truncate" title={src.source_name}>{src.source_name}</span>
                    <div class="flex items-center justify-between mt-1 pt-1 border-t border-gray-800/80">
                      {src.status === 'success' ? (
                        <span class="text-emerald-400 font-semibold flex items-center gap-1">
                          ✓ {src.schemes_found} scheme(s)
                        </span>
                      ) : src.status === 'skipped' ? (
                        <span class="text-gray-500 font-medium">⊘ robots.txt</span>
                      ) : (
                        <span class="text-rose-400 font-medium">✗ offline</span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Search & Filters */}
          <div class="mt-6 grid grid-cols-1 md:grid-cols-12 gap-3">
            {/* Search Input */}
            <div class="md:col-span-6 relative">
              <input
                type="text"
                placeholder="Search scheme name, eligibility, benefits..."
                value={keyword}
                onChange={(e) => setKeyword(e.target.value)}
                class="w-full bg-[#161b22] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition"
              />
            </div>

            {/* Provider Filter */}
            <div class="md:col-span-3">
              <select
                value={providerType}
                onChange={(e) => setProviderType(e.target.value)}
                class="w-full bg-[#161b22] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-orange-500"
              >
                {providers.map(p => (
                  <option key={p} value={p}>Provider: {p.charAt(0).toUpperCase() + p.slice(1)}</option>
                ))}
              </select>
            </div>

            {/* Category Filter */}
            <div class="md:col-span-3">
              <select
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                class="w-full bg-[#161b22] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-orange-500"
              >
                {categories.map(c => (
                  <option key={c} value={c}>Category: {c.charAt(0).toUpperCase() + c.slice(1)}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Scheme Cards Grid */}
          <div class="mt-8">
            {loading ? (
              <div class="text-center py-20 text-gray-400 text-sm">
                <svg class="animate-spin h-6 w-6 text-orange-500 mx-auto mb-2" viewBox="0 0 24 24" fill="none">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                Loading verified schemes...
              </div>
            ) : schemes.length === 0 ? (
              <div class="text-center py-20 glass-card rounded-2xl p-8">
                <div class="w-12 h-12 rounded-full bg-orange-500/10 text-orange-400 mx-auto flex items-center justify-center mb-3">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                </div>
                <h3 class="text-base font-semibold text-white">No schemes found</h3>
                <p class="text-gray-400 text-sm mt-1 max-w-sm mx-auto">
                  {keyword || category !== 'All' || providerType !== 'All'
                    ? "No schemes matched your current filter criteria."
                    : "No schemes currently stored in database. Click 'Refresh Sources' to collect and extract live schemes."}
                </p>
                <div class="mt-4 flex items-center justify-center gap-3">
                  {(keyword || category !== 'All' || providerType !== 'All') && (
                    <button
                      onClick={() => { setKeyword(''); setCategory('All'); setProviderType('All'); }}
                      class="px-4 py-2 rounded-xl text-xs font-medium bg-gray-800 hover:bg-gray-700 text-white transition"
                    >
                      Clear Filters
                    </button>
                  )}
                  <button
                    onClick={handleRefresh}
                    disabled={refreshing}
                    class="px-4 py-2 rounded-xl text-xs font-semibold bg-[#B5502F] hover:bg-[#9E4528] text-white transition"
                  >
                    Refresh Schemes Now
                  </button>
                </div>
              </div>
            ) : (
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                {schemes.map((scheme) => {
                  const isGov = scheme.provider_type === 'government';
                  return (
                    <div key={scheme.id} class="glass-card rounded-2xl p-5 flex flex-col justify-between transition hover:shadow-xl">
                      <div>
                        {/* Header Badges */}
                        <div class="flex items-center justify-between gap-2 mb-3">
                          <span class={`px-2.5 py-0.5 rounded-md text-xs font-semibold uppercase tracking-wider ${
                            isGov ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                          }`}>
                            {isGov ? 'Government' : 'NGO Initiative'}
                          </span>
                          {scheme.scheme_category && (
                            <span class="px-2.5 py-0.5 rounded-md text-xs font-medium bg-gray-800 text-gray-300 capitalize">
                              {scheme.scheme_category}
                            </span>
                          )}
                        </div>

                        {/* Title & Provider */}
                        <h2 class="text-lg font-bold text-white tracking-tight leading-snug mb-1">
                          {scheme.scheme_name || 'Unnamed Scheme'}
                        </h2>
                        <p class="text-xs text-gray-400 mb-4">
                          Authority: <span class="text-gray-300 font-medium">{scheme.provider_name || 'Not specified'}</span>
                        </p>

                        {/* Plain-Language Summary (Primary display for low-literacy users) */}
                        {scheme.simple_summary ? (
                          <div class="mb-4 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30">
                            <div class="flex items-center gap-1.5 mb-1.5">
                              <span class="text-[11px] font-bold uppercase tracking-wider text-amber-400">
                                Plain-Language Summary
                              </span>
                            </div>
                            <p class="text-sm leading-relaxed text-gray-200 font-medium">
                              {scheme.simple_summary}
                            </p>
                          </div>
                        ) : null}

                        {/* Large, Easy-to-Tap Read-Aloud Button (SVG icons, no emoji) */}
                        {speechSupported && (
                          <button
                            type="button"
                            onClick={() => handleToggleSpeech(scheme)}
                            class={`w-full mb-4 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2.5 transition shadow-md cursor-pointer ${
                              speakingSchemeId === scheme.id
                                ? 'bg-rose-600 hover:bg-rose-500 text-white ring-2 ring-rose-400 shadow-rose-950/40 animate-pulse'
                                : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-950/40'
                            }`}
                          >
                            {speakingSchemeId === scheme.id ? (
                              <>
                                <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                  <rect x="6" y="6" width="12" height="12" rx="2" />
                                </svg>
                                <span>Stop</span>
                              </>
                            ) : (
                              <>
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                </svg>
                                <span>Listen</span>
                              </>
                            )}
                          </button>
                        )}

                        {/* Benefits Section with scroll for long text */}
                        {scheme.benefits_offered ? (
                          <div class="mb-3 p-3 rounded-xl bg-gray-900/60 border border-gray-800">
                            <span class="text-xs font-semibold text-orange-300 block mb-1">
                              🎁 Benefits & Incentives
                            </span>
                            <p class="text-xs text-gray-300 leading-relaxed max-h-36 overflow-y-auto pr-1">
                              {scheme.benefits_offered}
                            </p>
                          </div>
                        ) : null}

                        {/* Eligibility Section with scroll for long text */}
                        {scheme.eligibility_summary ? (
                          <div class="mb-3 p-3 rounded-xl bg-gray-900/60 border border-gray-800">
                            <span class="text-xs font-semibold text-emerald-300 block mb-1">
                              ✓ Eligibility
                            </span>
                            <p class="text-xs text-gray-300 leading-relaxed max-h-28 overflow-y-auto pr-1">
                              {scheme.eligibility_summary}
                            </p>
                          </div>
                        ) : null}

                        {/* Application Deadline & Process (Graceful null display) */}
                        {(scheme.application_deadline || scheme.application_process) && (
                          <div class="mb-3 text-[11px] text-gray-400 flex flex-wrap gap-x-4 gap-y-1">
                            {scheme.application_deadline && (
                              <span>📅 Deadline: <strong class="text-gray-300">{scheme.application_deadline}</strong></span>
                            )}
                            {scheme.application_process && (
                              <span>📝 Process: <strong class="text-gray-300">{scheme.application_process}</strong></span>
                            )}
                          </div>
                        )}
                      </div>

                      {/* Footer Actions */}
                      <div class="pt-4 border-t border-gray-800/80 flex items-center justify-between mt-2">
                        <div class="text-[11px]">
                          {scheme.review_flagged ? (
                            <span class="text-amber-400/90 font-medium flex items-center gap-1">
                              <span>⚠️</span> Check portal for complete rules
                            </span>
                          ) : (
                            <span class="text-emerald-400/90 font-medium flex items-center gap-1">
                              <span>✓</span> Verified Source
                            </span>
                          )}
                        </div>

                        {scheme.official_source_url ? (
                          <a
                            href={scheme.official_source_url}
                            target="_blank"
                            rel="noopener noreferrer"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-white/10 hover:bg-white/20 text-white transition"
                          >
                            <span>Official Portal</span>
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                          </a>
                        ) : null}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
